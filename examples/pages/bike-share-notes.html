<h1>Notes on running a bike-share scheme</h1>
<p>A bike-share scheme lives or dies on dock availability, and most cities track it by hand. Tools that handle this: none out of the box. You upload the ride logs and define your own rules for splitting credit between modes (e.g., 50% walking, 50% bus).</p>
